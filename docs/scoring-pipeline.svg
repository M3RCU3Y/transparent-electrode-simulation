      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #scoring-pipeline-root { --color-paper: #f6f4ef; --color-ink: #1b2f4b; --color-muted: #3d5a80; --color-soft: #566880; --color-rule: rgba(27,47,75,0.12); --color-accent: #1f6f66;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #scoring-pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #scoring-pipeline-root .container { max-width: 1280px; margin: 0 auto; }
      #scoring-pipeline-root .header-eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.75rem; }
      #scoring-pipeline-root .subtitle { font-size: 1rem; line-height: 1.55; color: var(--color-muted); max-width: 70ch; }
      #scoring-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #scoring-pipeline-root code { font-family: var(--font-mono); font-size: 0.8rem; color: var(--color-ink); }</style>
  </defs>
