<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 128 1280 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scoring-pipeline-title scoring-pipeline-desc" id="scoring-pipeline-root">
<title id="scoring-pipeline-title">How one electrode gets its score</title>
<desc id="scoring-pipeline-desc">Seven stages that turn a film's carrier density and mobility into a solar-cell efficiency: optical constants, thin-film optics, photocurrent, device losses, efficiency, then the best thickness is kept.</desc>
