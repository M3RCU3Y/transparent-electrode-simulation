<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 88 1280 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
<title id="architecture-title">How the simulation code fits together</title>
<desc id="architecture-desc">Architecture of the PHYS 3153 transparent-electrode simulation: physics, material and optics modules feed the device model, which two driver scripts run to write the data files that the report plots.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --color-paper: #f6f4ef; --color-paper-2: #eef2f7;
      --color-ink: #1b2f4b; --color-muted: #3d5a80; --color-soft: #566880;
      --color-rule: rgba(27,47,75,0.12);
      --color-accent: #1f6f66; --color-accent-tint: rgba(42,157,143,0.10);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .container { max-width: 1280px; margin: 0 auto; }
      #architecture-root .header-eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.75rem; }
      #architecture-root .subtitle { font-size: 1rem; line-height: 1.55; color: var(--color-muted); max-width: 70ch; }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-root .card-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.875rem; padding-bottom: 0.875rem; border-bottom: 1px solid rgba(27,47,75,0.08); }
      #architecture-root .card-dot { width: 7px; height: 7px; border-radius: 50%; }
      #architecture-root .card-dot.ink { background: var(--color-ink); }
      #architecture-root .card-dot.muted { background: var(--color-muted); }
      #architecture-root .card-dot.coral { background: var(--color-accent); }
      #architecture-root code { font-family: var(--font-mono); font-size: 0.78rem; color: var(--color-ink); }</style>
